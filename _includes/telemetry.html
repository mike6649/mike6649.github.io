<div class="container justify-content-sm-center" style="display: grid; place-items: center">
    <div id="player" style="width: 90%; display: inline-flex;"></div>
    <div class="echarts-raw" id="speedchart" style="
width: 90%; height: min(300px, calc(30vw + 150px));"></div>
    <div class="echarts-raw" id="map" style="width: min(400px, 90vw); aspect-ratio: 1"></div>

</div>

<script src="{{ '/assets/js/papaparse.min.js' | relative_url | bust_file_cache }}"></script>
<script src="{{ site.third_party_libraries.echarts.url.js.library }}"
    integrity="{{ site.third_party_libraries.echarts.integrity.js.library }}" crossorigin="anonymous"></script>
<script>
    const UPDATE_MILLI = 100;

    var timeOffsetMilli = {{ include.timeOffsetMilli }} / 1000;
    var tag = document.createElement('script');

    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    var playerReady = false;
    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            videoId: '{{ include.videoId }}',
            playerVars: {
                'playsinline': 1
            },
            events: {
                'onReady': (event) => { playerReady = true }
            }
        });
    }

    var data;
    var lapBoundaries = [0];
    var gpsUpdate = [0];
    var obdUpdate = [0];
    var bestPathLap, bestPathLapMap, frechetMappings;
    var ymax, ymin, xmax, xmin;

    var radians = (d) => d * Math.PI / 180;

    const e2 = 8.18e-2;
    const a = 6378137;
    function latLongToEcef(lat, long, h) {
        lat = radians(lat);
        long = radians(long);

        let n = a / Math.sqrt(1 - e2 ** 2 * Math.sin(lat) ** 2);
        let x = (h + n) * Math.cos(lat) * Math.cos(long);
        let y = (h + n) * Math.cos(lat) * Math.sin(long);
        let z = (h + (1 - e2 ** 2) * n) * Math.sin(lat);
        return [x, y, z];
    }

    function ecefToLtp(x, y, z, x0, y0, z0, lat, long) {
        let lam = radians(lat);
        let phi = radians(long);
        x = x - x0;
        y = y - y0;
        z = z - z0;

        let e = -Math.sin(phi) * x + Math.cos(phi) * y;
        let n = -Math.cos(phi) * Math.sin(lam) * x - Math.sin(lam) * Math.sin(phi) * y + Math.cos(lam) * z;
        let u = Math.cos(lam) * Math.cos(phi) * x + Math.cos(lam) * Math.sin(phi) * y + Math.sin(lam) * z;
        return [e, n, u];
    }

    var distance = (a, b) => Math.sqrt((a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2);

    function dtwMatrix(p, q) {
        var f = (a, b) => a + b;  // Dynamic Time Warping. Frechet distance would be f = Math.max
        let m = p.length;
        let n = q.length;
        let C = new Array(m);
        for (let i = 0; i < m; i++) {
            C[i] = new Array(n);
            for (let j = 0; j < n; j++) {
                let dij = distance(p[i], q[j]);
                if (i == 0 && j == 0) {
                    C[i][j] = dij;
                } else if (i == 0) {
                    C[i][j] = f(dij, C[i][j - 1]);
                } else if (j == 0) {
                    C[i][j] = f(dij, C[i - 1][j]);
                } else {
                    C[i][j] = f(
                        dij,
                        Math.min(C[i][j - 1], C[i - 1][j], C[i - 1][j - 1])
                    );
                }
            }
        }
        return C;
    }

    var dtwDistance = (p, q) => dtwMatrix(p, q)[p.length - 1][q.length - 1];

    function dtwMatch(p, q) {
        let C = dtwMatrix(p, q);
        // return: array of size p, which maps to indices in q
        let m = p.length;
        let n = q.length;
        // get the path starting from C[m-1][n-1]
        let i = m - 1;
        let j = n - 1;
        let path = [];
        while (i > 0 || j > 0) {
            path.push([i, j]);
            let a = i > 0 && j > 0 ? C[i - 1][j - 1] : Infinity;
            let b = i > 0 ? C[i - 1][j] : Infinity;
            let c = j > 0 ? C[i][j - 1] : Infinity;
            if (a <= b && a <= c) {
                i--;
                j--;
            } else if (b <= a && b <= c) {
                i--;
            } else j--;
        }
        path.push([0, 0]);
        path.reverse();

        let a = new Array(m);
        for (let idx = 0; idx < path.length; idx++) {
            [i, j] = path[idx];
            a[i] = j;
        }
        return a;
    }

    function processData(results, file) {
        let tData = results.data.slice(0, results.data.length - 1);  // last data point is junk
        let x;
        let refCoord = latLongToEcef(tData[0].Latitude, tData[0].Longitude, tData[0]["Altitude (m)"]);

        for (let i = 0; i < tData.length; i++) {
            x = tData[i];
            if (i == 0) {
                x.lapDistance = 0;
            }
            if (x.Lap >= lapBoundaries.length) {
                lapBoundaries.push(i);
            }
            if (x.OBD_Update === 1 && i > 0) {
                obdUpdate.push(i);
            }
            if (x.GPS_Update === 1 && i > 0) {
                gpsUpdate.push(i);
            }

            let c = latLongToEcef(x.Latitude, x.Longitude, x["Altitude (m)"]);
            tData[i].coords = ecefToLtp(...c, ...refCoord, x.Latitude, x.Longitude);
        }
        obdUpdate.push(tData.length - 1);
        gpsUpdate.push(tData.length - 1);

        let obdIdx = 1;
        let gpsIdx = 1;
        let t1, t0, y1, y0, i1, i0;
        for (let i = 0; i < tData.length; i++) {
            x = tData[i];
            t = x.Time;
            // interpolate speed
            if (i >= obdUpdate[obdIdx]) {
                obdIdx++;
            } else {
                i1 = obdUpdate[obdIdx];
                i0 = obdUpdate[obdIdx - 1];

                t1 = tData[i1].Time;
                t0 = tData[i0].Time;
                y1 = tData[i1].speed;
                y0 = tData[i0].speed;
                x.speed = y0 + (t - t0) * (y1 - y0) / (t1 - t0);
            }

            // interpolate gps
            if (i >= gpsUpdate[gpsIdx]) {
                gpsIdx++;
            } else {
                i1 = gpsUpdate[gpsIdx];
                i0 = gpsUpdate[gpsIdx - 1];

                t1 = tData[i1].Time;
                t0 = tData[i0].Time;
                y1 = tData[i1].coords;
                y0 = tData[i0].coords;
                for (let j = 0; j < 3; j++) {
                    x.coords[j] = y0[j] + (t - t0) * (y1[j] - y0[j]) / (t1 - t0);
                }
            }
        }

        // find lap with best path
        let lapPaths = [];
        let lapCount = lapBoundaries.length;
        for (let i = 0; i < lapCount; i++) {
            let lapStartIdx = lapBoundaries[i];
            let lapEndIdx = i + 1 < lapCount ? lapBoundaries[i + 1] : tData.length;
            let tMapData = tData.slice(lapStartIdx, lapEndIdx).filter((x) => x.GPS_Update === 1).map((x) => [x.coords[0], x.coords[1]]);
            if (i > 0 && i < lapCount - 1) {
                tMapData.push(tMapData[0]);
            }
            lapPaths.push(tMapData);
        }

        let M = new Array(lapCount);
        for (let i = 0; i < lapCount; i++) {
            M[i] = new Array(lapCount);
        }
        for (let i = 0; i < lapCount; i++) {
            for (let j = i; j < lapCount; j++) {
                if (j == i) {
                    M[i][j] = 0;
                }
                M[i][j] = dtwDistance(lapPaths[i], lapPaths[j]);
                M[j][i] = M[i][j];
            }
        }

        let avgDist = M.map((m) => m.reduce((sum, d) => sum + d) / (lapCount - 1));
        bestPathLap = 0;
        for (let i = 0; i < lapCount; i++) {
            if (avgDist[bestPathLap] > avgDist[i]) {
                bestPathLap = i;
            }
        }

        bestPathLapMap = lapPaths[bestPathLap];
        lapPaths = [];

        for (let i = 0; i < lapCount; i++) {
            let lapStartIdx = lapBoundaries[i];
            let lapEndIdx = i + 1 < lapCount ? lapBoundaries[i + 1] : tData.length;
            let tMapData = tData.slice(lapStartIdx, lapEndIdx).map((x) => [x.coords[0], x.coords[1]]);
            lapPaths.push(tMapData);
        }

        [xmax, ymax] = lapPaths[bestPathLap][0];
        [xmin, ymin] = lapPaths[bestPathLap][0];
        for (let i = 1; i < lapPaths[bestPathLap].length; i++) {
            [x, y] = lapPaths[bestPathLap][i];
            xmax = Math.max(xmax, x);
            ymax = Math.max(ymax, y);
            xmin = Math.min(xmin, x);
            ymin = Math.min(ymin, y);
        }

        let lengthToStretch = Math.abs((ymax - ymin) - (xmax - xmin)) / 2;
        let stretchX = ymax - ymin > xmax - xmin;
        xmin = xmin - stretchX * lengthToStretch;
        ymin = ymin - !stretchX * lengthToStretch;
        xmax = xmax + stretchX * lengthToStretch;
        ymax = ymax + !stretchX * lengthToStretch; 

        frechetMappings = new Array(lapCount);
        for (let i = 0; i < lapCount; i++) {
            frechetMappings[i] = dtwMatch(lapPaths[i], lapPaths[bestPathLap]);
        }

        data = tData;
        console.info(data);
    }

    Papa.parse(
        '{{ include.telemPath | relative_url | bust_file_cache }}',
        {
            download: true,
            comments: "#",
            header: true,
            dynamicTyping: true,
            transformHeader: function (h) {
                if (h === "Vehicle Speed (mph) *OBD") {
                    return "speed";
                }
                return h;
            },
            complete: function (results, file) {
                processData(results, file);
            },
            error: function (results, file) {
                console.error("Error:", results.toString(), file);
            }
        }
    );

    function findIndexInData(t, start, end) {
        if (t > data[end].Time && end !== data.length - 1) {
            return findIndexInData(t, start, data.length - 1);
        }
        if (t < data[start].Time && start !== 0) {
            return findIndexInData(t, 0, end);
        }

        while (start <= end) {
            let mid = Math.floor((start + end) / 2);
            let time = data[mid].Time;
            if (time == t) {
                return mid;
            } else if (time < t) {
                start = mid + 1;
            } else {
                end = mid - 1;
            }
        }
        return Math.min(start, data.length - 1);
    }

    var getLapTime = (idx) => data[idx].Time - data[lapBoundaries[data[idx].Lap]].Time;

    let chartElement = document.getElementById("speedchart");
    let mapchartElement = document.getElementById("map");
    var speedchart, mapchart;
    var themeSetting = typeof (determineThemeSetting) !== "undefined" ? determineThemeSetting() : "default";
    if (themeSetting === "dark") {
        speedchart = echarts.init(chartElement, "dark");
        mapchart = echarts.init(mapchartElement, "dark");
    } else {
        speedchart = echarts.init(chartElement);
        mapchart = echarts.init(mapchartElement);
    }

    window.addEventListener('resize', function () {
        speedchart.resize();
        mapchart.resize();
    });

    let currentTime = 0;
    let idx = 0;
    let lap = null;
    let speedGraphData = null;

    var renderLoop = () => {
        if (!data || !playerReady) return;
        let _currentTime = player.getCurrentTime() + timeOffsetMilli;
        if (_currentTime === currentTime) {
            return;
        }
        currentTime = _currentTime;
        let _idx = findIndexInData(currentTime, idx, Math.min(idx + 15, data.length - 1));
        if (_idx === idx) {
            return;
        }
        idx = _idx;
        let _lap = data[idx].Lap;

        if (_lap !== lap) {
            lap = _lap;
            let lapStartIdx = lapBoundaries[lap];
            let lapEndIdx = lap + 1 < lapBoundaries.length ? lapBoundaries[lap + 1] : data.length;
            let tData = data.slice(lapStartIdx, lapEndIdx);
            let obdData = tData.filter((x) => x.OBD_Update === 1);
            let gpsData = tData.filter((x) => x.GPS_Update === 1);
            speedGraphData = obdData.map((x) => [x.Time - data[lapBoundaries[lap]].Time, x["speed"]]);
        }

        let mappedIdx = frechetMappings[lap][idx - lapBoundaries[lap]] + lapBoundaries[bestPathLap];

        speedchart.setOption({
            grid: {
                top: 50,
                bottom: 0,
                left: 0,
                right: 0
            },
            animationEasing: 'quadraticOut',
            animationDurationUpdate: UPDATE_MILLI * 1.5,
            title: {
                text: `Lap ${lap}`
            },
            xAxis: {
                name: 'Time'
            },
            yAxis: {
                name: 'MPH'
            },
            tooltip: {
                trigger: 'axis'
            },
            series: [
                {
                    type: 'line',
                    data: speedGraphData,
                    showSymbol: false,
                    markPoint: {
                        data: [
                            { coord: [getLapTime(idx), data[idx].speed] }
                        ],
                        symbol: 'circle',
                        symbolSize: 15,
                        animation: false,
                    },
                    markLine: {
                        symbol: 'none',
                        data: [
                            { xAxis: getLapTime(idx) }
                        ]
                    }
                }
            ]
        });

        mapchart.setOption({
            grid: {
                top: 0,
            },
            animation: false,
            xAxis: {
                type: 'value',
                max: xmax + 10,
                min: xmin - 10,
                show: false
            },
            yAxis: {
                type: 'value',
                max: ymax + 10,
                min: ymin - 10,
                show: false
            },
            series: [
                {
                    type: 'line',
                    data: bestPathLapMap,
                    showSymbol: false,
                    smooth: true,
                    markPoint: {
                        data: [
                            { coord: [data[mappedIdx].coords[0] + 1, data[mappedIdx].coords[1] + 1] }
                        ],
                        symbol: 'rect',
                        symbolSize: 16,
                        animation: false,
                    }
                },
                {
                    type: 'line',
                    markPoint: {
                        data: [
                            { coord: [data[idx].coords[0], data[idx].coords[1]] }
                        ],
                        symbol: 'diamond',
                        itemStyle: {
                            color: 'red'
                        },
                        symbolSize: 15,
                        animation: false,
                    }
                }
            ]
        });
    }
    setInterval(() => renderLoop(), UPDATE_MILLI);

</script>
